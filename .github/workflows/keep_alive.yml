name: Keep FastAPI Awake

# Render's free tier spins a service down after ~15 minutes idle, and a cold start
# then costs the first visitor ~50 seconds. This pings /health to hold it open.
#
# Read this before relying on it: GitHub's scheduled runner is best-effort. Its own
# docs warn that schedules are delayed during high load, and short intervals are
# the first to be dropped, so a */5 cron routinely lands 15-40 minutes late. That
# is wider than Render's idle window, so the service WILL still sleep sometimes.
# For real uptime use an external pinger (cron-job.org, UptimeRobot) or a paid
# Render instance that never sleeps. This workflow is a backstop, not a guarantee.

on:
  schedule:
    # Every 5 minutes, so a dropped run still leaves a chance inside the 15-minute
    # idle window. Cannot be shorter than 5 on GitHub.
    - cron: '*/5 * * * *'
  # Lets you prove it works instead of guessing: Actions tab -> this workflow ->
  # Run workflow.
  workflow_dispatch:

permissions:
  contents: read

# A late run plus an on-time run must not pile up.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health until it answers
        run: |
          set -euo pipefail
          URL="${{ vars.KEEP_ALIVE_URL || 'https://aahaar-be.onrender.com/health' }}"
          # A sleeping instance needs ~50s to boot, so allow retries with a long
          # per-attempt timeout. --fail makes a 5xx an actual failure instead of a
          # green tick over a broken service.
          for attempt in 1 2 3 4 5; do
            echo "attempt $attempt -> $URL"
            # --head: /health answers HEAD, so a ping costs headers only — no JSON
            # body built or transferred just to prove the instance is awake.
            if curl --head --fail --show-error --silent --location \
                    --max-time 90 --retry 0 "$URL"; then
              echo
              echo "awake"
              exit 0
            fi
            echo "no answer yet, waiting 20s"
            sleep 20
          done
          echo "::error::$URL did not answer after 5 attempts"
          exit 1
