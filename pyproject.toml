[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "scripts"]
extend-exclude = ["venv", ".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP046"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Path",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "fastapi.params.File",
    "app.dependencies.auth.require_roles",
]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["I", "UP", "RUF100"]
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
